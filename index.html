<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUDE I AM GAMER - Client Memo System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #06b6d4;
            --text-color: #f8fafc;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 10px;
            border-bottom: 3px solid var(--accent-color);
        }

        header h1 {
            color: var(--accent-color);
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 13px;
            margin-bottom: 5px;
            color: #94a3b8;
        }

        input, select {
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: #fff;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .btn-submit {
            margin-top: 15px;
            grid-column: 1 / -1;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        /* Table Design */
        .table-responsive {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background-color: #0f172a;
            color: var(--accent-color);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-active { background: #166534; color: #4ade80; }
        .badge-expired { background: #991b1b; color: #fca5a5; }

        .btn-delete {
            background: var(--danger-color);
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DUDE I AM GAMER</h1>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Business Management Panel Memo</p>
    </header>

    <!-- Entry Form -->
    <div class="form-card">
        <form id="memoForm" class="form-grid">
            <div class="input-group">
                <label>Date</label>
                <input type="date" id="dateInput" required>
            </div>

            <div class="input-group">
                <label>Customer Name</label>
                <input type="text" id="nameInput" placeholder="Name" required>
            </div>

            <div class="input-group">
                <label>SID</label>
                <input type="text" id="sidInput" placeholder="Server/User ID" required>
            </div>

            <div class="input-group">
                <label>Key Category</label>
                <select id="keyCategory">
                    <option value="Premium">Premium</option>
                    <option value="External">External</option>
                    <option value="Lite">Lite</option>
                    <option value="Bypass">Bypass</option>
                    <option value="Free">Free</option>
                    <option value="Phone Panel">Phone Panel</option>
                </select>
            </div>

            <div class="input-group">
                <label>Key Value/Code</label>
                <input type="text" id="keyValue" placeholder="Enter Key String" required>
            </div>

            <div class="input-group">
                <label>Platform</label>
                <select id="platformSelect">
                    <option value="Discord">Discord</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Telegram">Telegram</option>
                    <option value="Imo">Imo</option>
                    <option value="Instagram">Instagram</option>
                </select>
            </div>

            <div class="input-group">
                <label>Contact Info (No/Name)</label>
                <input type="text" id="contactDetails" placeholder="Number or Username" required>
            </div>

            <div class="input-group">
                <label>Validity Plan</label>
                <select id="validityPlan">
                    <option value="Permanent">Permanent</option>
                    <option value="Yearly">Yearly (365 Days)</option>
                    <option value="Monthly">Monthly (30 Days)</option>
                    <option value="Weekly">Weekly (7 Days)</option>
                    <option value="Day">1 Day</option>
                </select>
            </div>

            <!-- Pricing Fields -->
            <div class="input-group">
                <label>Total Price (Tk)</label>
                <input type="number" id="totalTk" value="0" required>
            </div>

            <div class="input-group">
                <label>Discount (Tk)</label>
                <input type="number" id="discountTk" value="0">
            </div>

            <div class="input-group">
                <label>Advance Paid (Tk)</label>
                <input type="number" id="advanceTk" value="0">
            </div>

            <button type="submit" class="btn-submit">Add Entry to Panel</button>
        </form>
    </div>

    <!-- Data Table -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>SID</th>
                    <th>Category & Key</th>
                    <th>Platform Info</th>
                    <th>Validity</th>
                    <th>Time Remaining</th>
                    <th>Pricing Details</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="memoTableBody">
                <!-- Entries populated dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Set auto date to today
    document.getElementById('dateInput').valueAsDate = new Date();

    let memoEntries = JSON.parse(localStorage.getItem('dude_gamer_memos')) || [];

    const memoForm = document.getElementById('memoForm');
    const memoTableBody = document.getElementById('memoTableBody');

    memoForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const date = document.getElementById('dateInput').value;
        const name = document.getElementById('nameInput').value;
        const sid = document.getElementById('sidInput').value;
        const keyCat = document.getElementById('keyCategory').value;
        const keyVal = document.getElementById('keyValue').value;
        const platform = document.getElementById('platformSelect').value;
        const contact = document.getElementById('contactDetails').value;
        const plan = document.getElementById('validityPlan').value;
        
        const total = parseFloat(document.getElementById('totalTk').value) || 0;
        const discount = parseFloat(document.getElementById('discountTk').value) || 0;
        const advance = parseFloat(document.getElementById('advanceTk').value) || 0;

        // Financial Calculation
        const finalPrice = Math.max(0, total - discount);
        const due = Math.max(0, finalPrice - advance);

        // Expiry Calculation
        let expireDate = null;
        const now = new Date().getTime();

        if (plan === 'Day') expireDate = now + (1 * 24 * 60 * 60 * 1000);
        else if (plan === 'Weekly') expireDate = now + (7 * 24 * 60 * 60 * 1000);
        else if (plan === 'Monthly') expireDate = now + (30 * 24 * 60 * 60 * 1000);
        else if (plan === 'Yearly') expireDate = now + (365 * 24 * 60 * 60 * 1000);
        else if (plan === 'Permanent') expireDate = 'PERMANENT';

        const entry = {
            id: Date.now(),
            date, name, sid, keyCat, keyVal, platform, contact, plan,
            total, discount, advance, due, finalPrice, expireDate
        };

        memoEntries.push(entry);
        saveAndRender();
        memoForm.reset();
        document.getElementById('dateInput').valueAsDate = new Date();
    });

    function saveAndRender() {
        localStorage.setItem('dude_gamer_memos', JSON.stringify(memoEntries));
        renderTable();
    }

    function deleteEntry(id) {
        memoEntries = memoEntries.filter(item => item.id !== id);
        saveAndRender();
    }

    function renderTable() {
        memoTableBody.innerHTML = '';
        const now = new Date().getTime();

        memoEntries.forEach(item => {
            let statusText = '';
            let isExpired = false;

            if (item.expireDate === 'PERMANENT') {
                statusText = '<span class="badge badge-active">Permanent Active</span>';
            } else {
                const diff = item.expireDate - now;
                if (diff <= 0) {
                    statusText = '<span class="badge badge-expired">EXPIRED</span>';
                    isExpired = true;
                } else {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    statusText = `<span class="badge badge-active">${days}d ${hours}h ${minutes}m left</span>`;
                }
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.date}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.sid}</td>
                <td><small style="color:var(--accent-color)">[${item.keyCat}]</small><br>${item.keyVal}</td>
                <td><small>${item.platform}</small><br>${item.contact}</td>
                <td>${item.plan}</td>
                <td>${statusText}</td>
                <td>
                    Total: ${item.total} Tk<br>
                    <small>Dis: ${item.discount} | Adv: ${item.advance}</small><br>
                    <strong style="color:${item.due > 0 ? '#ef4444' : '#22c55e'}">Due: ${item.due} Tk</strong>
                </td>
                <td>
                    <button class="btn-delete" onclick="deleteEntry(${item.id})">Delete</button>
                </td>
            `;
            memoTableBody.appendChild(tr);
        });
    }

    // Auto Refresh Countdown every 60 seconds
    setInterval(renderTable, 60000);

    // Initial Load
    renderTable();
</script>
</body>
</html>
